<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#0c1415"/><text x="60" y="60" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="27" fill="#e5eee8">桌面總覽｜限定卡池優先｜結構示意（非最終視覺）</text><rect x="60" y="100" width="1320" height="160" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="78" y="130" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">A. 整體星運主視覺｜徽章＋稱號＋分數＋可信度</text><rect x="60" y="285" width="645" height="215" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="78" y="315" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">B. 限定角色｜主卡｜角色立繪＋出金＋保底</text><rect x="735" y="285" width="645" height="215" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="753" y="315" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">C. 限定武器｜主卡｜武器圖＋出金＋保底</text><rect x="60" y="525" width="1320" height="200" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="78" y="555" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">D. 最近限定五星｜大肖像、角色名、出金抽數、日期</text><rect x="60" y="750" width="1320" height="160" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="78" y="780" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">E. 其他卡池｜次要折疊區（常駐、新手等）</text><text x="80" y="950" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="18" fill="#d5b66c">順序不可顛倒：整體評級 → 限定角色 → 限定武器 → 最近五星 → 其他</text></svg>