<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#0c1415"/><text x="60" y="60" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="27" fill="#e5eee8">分享圖與手機版｜結構示意</text><rect x="60" y="100" width="780" height="800" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="78" y="130" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">A. Discord 角色分享圖（固定寬度，重點清楚）</text><rect x="90" y="160" width="330" height="420" rx="14" fill="#233735" stroke="#365b55" stroke-width="2"/><text x="108" y="190" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">角色大立繪</text><rect x="440" y="160" width="370" height="185" rx="14" fill="#233735" stroke="#365b55" stroke-width="2"/><text x="458" y="190" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">徽章＋稱號＋R 目標</text><rect x="440" y="365" width="370" height="215" rx="14" fill="#233735" stroke="#365b55" stroke-width="2"/><text x="458" y="395" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">核心數據｜大字</text><rect x="90" y="610" width="720" height="230" rx="14" fill="#233735" stroke="#365b55" stroke-width="2"/><text x="108" y="640" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">取得里程碑／簡明註記</text><rect x="900" y="100" width="460" height="800" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="918" y="130" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">B. 手機單欄順序</text><rect x="930" y="160" width="400" height="110" rx="14" fill="#233735" stroke="#365b55" stroke-width="2"/><text x="948" y="190" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">1 角色／稱號主視覺</text><rect x="930" y="290" width="400" height="110" rx="14" fill="#233735" stroke="#36