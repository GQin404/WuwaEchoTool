<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000"><rect width="1440" height="1000" fill="#0c1415"/><text x="60" y="60" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="27" fill="#e5eee8">角色分析｜角色立繪為主角｜結構示意</text><rect x="60" y="100" width="490" height="480" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="78" y="130" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">A. 角色立繪（大圖）＋角色名稱＋星級</text><rect x="580" y="100" width="800" height="230" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="598" y="130" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">B. 取得次數＋平均五星間隔＋最短／最長</text><rect x="580" y="355" width="800" height="225" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="598" y="385" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">C. 角色星運｜R0～R6＋稱號＋徽章＋可信度</text><rect x="60" y="605" width="1320" height="250" rx="14" fill="#172b2a" stroke="#365b55" stroke-width="2"/><text x="78" y="635" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#e5eee8">D. 取得時間軸｜逐次五星間隔｜完整性說明</text><text x="80" y="910" font-family="Noto Sans CJK TC,Microsoft JhengHei,sans-serif" font-size="19" fill="#d5b66c">若立繪缺失，顯示清楚占位與錯誤；不可留下大片空白。</text></svg>